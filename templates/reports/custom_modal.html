<div class="modal-overlay" id="customReportModal" data-download-url="{% url 'reports:download' %}">

    <div class="modal-container">

        <div class="modal-header">

            <h2>

                Custom Report

            </h2>

            <button id="closeCustomModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>

                    Start Date

                </label>

                <input type="date" id="customStartDate">

            </div>

            <div class="form-group">

                <label>

                    End Date

                </label>

                <input type="date" id="customEndDate">

            </div>

        </div>

        <div class="modal-actions">

            <button class="download-btn" id="confirmCustomDownload">

                <i class="fa-solid fa-download"></i>

                Download PDF

            </button>

        </div>

    </div>

</div>
