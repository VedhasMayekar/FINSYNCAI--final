<div class="dashboard-cards">

    <!-- Total Balance -->

    <div class="dashboard-card">

        <div class="card-top">

            <div class="card-icon balance">
                <i class="fa-solid fa-wallet"></i>
            </div>

        </div>

        <span class="card-title">
            Total Balance
        </span>

        <h2 class="card-value">
            ₹{{ total_balance|floatformat:0 }}
        </h2>

        <p class="card-subtitle">
            Current Account Balance
        </p>

    </div>



    <!-- Total Income -->

    <div class="dashboard-card">

        <div class="card-top">

            <div class="card-icon income">
                <i class="fa-solid fa-arrow-down"></i>
            </div>

        </div>

        <span class="card-title">
            Total Income
        </span>

        <h2 class="card-value">
            ₹{{ total_income|floatformat:0 }}
        </h2>

        <p class="card-subtitle">
            Lifetime Income
        </p>

    </div>



    <!-- Total Expense -->

    <div class="dashboard-card">

        <div class="card-top">

            <div class="card-icon expense">
                <i class="fa-solid fa-arrow-up"></i>
            </div>

        </div>

        <span class="card-title">
            Total Expense
        </span>

        <h2 class="card-value">
            ₹{{ total_expense|floatformat:0 }}
        </h2>

        <p class="card-subtitle">
            Lifetime Expenses
        </p>

    </div>



    <!-- Net Savings -->

    <div class="dashboard-card">

        <div class="card-top">

            <div class="card-icon invest">
                <i class="fa-solid fa-chart-line"></i>
            </div>

        </div>

        <span class="card-title">
            Net Savings
        </span>

        <h2 class="card-value">
            ₹{{ net_savings|floatformat:0 }}
        </h2>

        <p class="card-subtitle">
            Income − Expenses
        </p>

    </div>

</div>
